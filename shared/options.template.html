<!doctype html>
<!-- Template for each extension's options.html; scripts/build.ps1 fills in the {{...}} values. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{NAME}} Settings</title>
    <style>
        :root {
            color-scheme: light;
            --text: #202124;
            --muted: #555;
            --background: #fff;
            --field: #fff;
            --border: #8f8f9d;
            --error: #b42318;
        }
        :root[data-theme="dark"] {
            color-scheme: dark;
            --text: #e8eaed;
            --muted: #a8abb0;
            --background: #1c1b22;
            --field: #2b2a33;
            --border: #6e6d76;
            --error: #ff8a80;
        }
        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                color-scheme: dark;
                --text: #e8eaed;
                --muted: #a8abb0;
                --background: #1c1b22;
                --field: #2b2a33;
                --border: #6e6d76;
                --error: #ff8a80;
            }
        }
        body { max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; color: var(--text); background: var(--background); font: 16px/1.5 sans-serif; }
        h1 { font-size: 1.5rem; }
        label { display: block; margin: 1.5rem 0 .4rem; font-weight: 600; }
        input, select { box-sizing: border-box; padding: .65rem; font: inherit; color: inherit; background: var(--field); border: 1px solid var(--border); border-radius: 4px; }
        input { width: 100%; }
        p { color: var(--muted); }
        button { margin-top: 1rem; padding: .55rem 1rem; font: inherit; }
        #status { min-height: 1.5em; }
        #status[data-error="true"] { color: var(--error); }
    </style>
    <script src="shared/options-theme.js"></script>
</head>
<body>
    <h1>Download folder</h1>
    <form>
        <label for="download-folder">Folder inside the browser's download directory</label>
        <input id="download-folder" type="text" autocomplete="off" spellcheck="false">
        <p>Use a relative path, such as <code>{{EXAMPLE_FOLDER_WINDOWS}}</code> or <code>{{EXAMPLE_FOLDER}}</code>. Leave empty to use the download directory itself. Absolute paths are controlled by Firefox.</p>
        <button type="submit">Save</button>
        <p id="status" role="status" aria-live="polite"></p>
    </form>

    <h1>Appearance</h1>
    <label for="theme">Theme</label>
    <select id="theme">
        <option value="system">Same as system</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
    </select>

    <script src="shared/download-settings.js"></script>
    <script src="shared/download-options.js"></script>
</body>
</html>
